<!DOCTYPE html>
<html>

<head>
    <title>Ribbit - Development</title>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8" />
    <link rel="stylesheet" href="./styles/ribbit.css">
    <link rel="stylesheet" href="./styles/settings.css">
    <!-- <script src="./scripts/gps.js"></script> -->
    <!-- <script src="./scripts/settings.js"></script> -->
</head>

<body>
    <div id="settings">
        <div class="page">
            <label for="settings-1">User Settings</label>
            <input type="radio" name="settings" id="settings-1" checked>
            <div class="page-content">
                <div class="setting">
                    <label for="mode">Mode:</label>
                    <select id="mode">
                        <option selected option="Chat">Chat</option>
                        <option option="QSO">QSO (Coming Soon...)</option>
                    </select>
                </div>
                <div class="setting">
                    <label for="name">Operator Name:</label>
                    <input id="name" type="text" required placeholder="John Doe">
                </div>
                <div class="setting">
                    <label for="callsign">Callsign:</label>
                    <!-- force callsign to be all uppercase -->
                    <input id="callsign" type="text" required placeholder="W1AW">
                    <script type="text/javascript">
                    </script>
                </div>
                <div class="setting">
                    <button id="updateGPS" onclick="UpdateGPSPosition();">
                        Update GPS
                    </button>
                    <input id="latitude" type="number" readonly placeholder="Latitude">
                    <input id="longitude" type="number" readonly placeholder="Longitude">
                </div>
                <div class="setting">
                    <label for="gridsquare">Grid Square:</label>
                    <input id="gridsquare" type="text" required placeholder="FN42">
                </div>
            </div>
            <label for="settings-2">Application Settings</label>
            <input type="radio" name="settings" id="settings-2">
            <div class="page-content">
                <div class="setting">
                    <label for="microphone">Microphone (Rx):</label>
                    <select id="microphone">
                        <option>Default</option>
                    </select>
                </div>
                <div class="setting">
                    <label for="speaker">Speaker (Tx):</label>
                    <select id="speaker">
                        <option>Default</option>
                    </select>
                </div>
                <div class="setting">
                    <label for="savemessages">Save Messages:</label>
                    <input id="savemessages" checked type="checkbox">
                </div>
                <div class="setting">
                    <label for="messagecount">Messages:</label>
                    <input id="messagecount" type="messagecount" readonly value="0">
                    <button id="clearmessages" onclick="showClearMessageConfirm();">Clear Messages</button>
                </div>
            </div>
            <label for="settings-3">System Settings</label>
            <input type="radio" name="settings" id="settings-3">
            <div class="page-content">
                <div class="setting">
                    <button id="reset" onclick="resetSettings();">Reset Settings to Default</button>
                </div>
                <div class="setting">
                    <button id="clearCache" onclick="clearCache();">Clear Messages Log</button>
                </div>
                <div class="setting">
                    <button id="checkForUpdates">Check for Updates</button>
                </div>
                <div class="setting">
                    <button id="InstallApp">Install App</button>
                </div>
            </div>
            <div class="setting">
                <button id="cancel" onclick="closeSettings();">EXIT WITHOUT SAVING</span></button>
                <button id="close" onclick="saveSettings();">SAVE & CLOSE</button>
            </div>
        </div>
    </div>
</body>

</html>
