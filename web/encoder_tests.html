<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribbit Message Codec Tests</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
            background: #f0f2f5;
            color: #1a1a1a;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 {
            color: #1a1a1a;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .test-results {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .test-results div {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
        }

        .pass {
            color: #059669;
            font-weight: 600;
            background: #ecfdf5;
            border: 1px solid #d1fae5;
        }

        .fail {
            color: #dc2626;
            font-weight: 600;
            background: #fef2f2;
            border: 1px solid #fee2e2;
        }

        .audio-test {
            margin-top: 32px;
            padding: 32px;
            background: #1e293b;
            color: #f8fafc;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .audio-test h2 {
            margin-top: 0;
            font-weight: 700;
            font-size: 1.5rem;
            color: #f1f5f9;
        }

        #spectrogramContainer {
            margin-top: 24px;
            background: #000;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            max-width: 800px;
        }

        .controls {
            margin: 24px 0;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
        }

        #btnPlayAudio {
            background: #10b981;
        }

        #btnPlayAudio:hover {
            background: #059669;
        }

        #audioStatus {
            font-size: 0.875rem;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body>
    <h1>🐸 Ribbit Message Codec Tests</h1>
    <p>Verifying <code>MessageCodec.js</code> functionality.</p>

    <div class="test-results" id="testResults">Running tests...</div>

    <div class="audio-test">
        <h2>🎵 Audio Encoding & Spectrogram</h2>
        <div class="controls">
            <button id="btnRunAudioTest">Run Audio Encoding Test</button>
            <button id="btnPlayAudio" disabled>▶ Play Audio</button>
        </div>
        <div id="audioStatus">Initialize WASM to test audio...</div>
        <div id="spectrogramContainer">
            <canvas id="spectrogramCanvas"></canvas>
        </div>
    </div>

    <!-- Load Test script as module -->
    <script type="module" src="scripts/message_codec_tests.js?v=2"></script>

</body>

</html>
