<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribbit Decoding & Stress Tests</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
            background: #f0f2f5;
            color: #1a1a1a;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 {
            color: #1a1a1a;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
        }

        input[type="number"],
        input[type="text"],
        select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            vertical-align: middle;
        }

        label:has(input[type="checkbox"]) {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #64748b;
        }

        button.secondary:hover {
            background: #475569;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .test-results {
            margin-top: 24px;
        }

        .result-item {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            border-left: 4px solid #cbd5e1;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-item.pass {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .result-item.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .status-badge.pass {
            background: #10b981;
            color: white;
        }

        .status-badge.fail {
            background: #ef4444;
            color: white;
        }

        .result-details {
            font-size: 0.85rem;
            color: #475569;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .summary-stats {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
        }

        .stat-card {
            flex: 1;
            padding: 16px;
            border-radius: 8px;
            background: #f1f5f9;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
        }

        #spectrogramContainer {
            margin-top: 24px;
            background: #000;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            display: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            width: 100%;
            height: 100px;
        }

        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background: #1e293b;
            color: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .log-time {
            color: #94a3b8;
            margin-right: 8px;
        }

        .log-info {
            color: #3b82f6;
        }

        .log-success {
            color: #10b981;
        }

        .log-error {
            color: #ef4444;
        }

        .log-warn {
            color: #f59e0b;
        }

        .noise-slider {
            width: 200px;
        }
    </style>
</head>

<body>
    <h1>🐸 Ribbit Decoding Stress Tests</h1>
    <p>Stress testing the <code>RibbitWASM</code> decoding and message detection system.</p>

    <div class="card">
        <h2>🧪 Test Controls</h2>
        <div class="controls">
            <div class="control-group">
                <label for="noiseLevel">Noise Level (SNR)</label>
                <input type="range" id="noiseLevel" class="noise-slider" min="0" max="100" value="0">
                <span id="noiseVal">SNR: Clear</span>
            </div>
            <div class="control-group">
                <label for="testCount">Messages to Send</label>
                <input type="number" id="testCount" min="1" max="1000" value="10">
            </div>
            <div class="control-group">
                <label for="delay">Delay Between (ms)</label>
                <input type="number" id="delay" min="0" max="5000" value="500">
            </div>
            <div class="control-group">
                <label for="useWakeupTone">
                    <input type="checkbox" id="useWakeupTone" checked>
                    Add Wake-up Tone (300Hz, 200ms)
                </label>
            </div>
        </div>
        <div class="controls">
            <button id="btnRunBasicTests">Run Basic Tests</button>
            <button id="btnRunStressTest">Run Stress Test</button>
            <button id="btnRunValidationTests">Run Validation Tests</button>
            <button id="btnStopTests" class="danger" disabled>Stop</button>
            <button id="btnClearResults" class="secondary">Clear Results</button>
        </div>
    </div>

    <div class="card">
        <h2>📊 Results Summary</h2>
        <div class="summary-stats">
            <div class="stat-card">
                <span id="totalTests" class="stat-value">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span id="passedTests" class="stat-value" style="color: #10b981;">0</span>
                <span class="stat-label">Passed</span>
            </div>
            <div class="stat-card">
                <span id="failedTests" class="stat-value" style="color: #ef4444;">0</span>
                <span class="stat-label">Failed</span>
            </div>
            <div class="stat-card">
                <span id="accuracy" class="stat-value">0%</span>
                <span class="stat-label">Accuracy</span>
            </div>
        </div>
        <div id="testResults" class="test-results">
            <!-- Results will be injected here -->
        </div>
    </div>

    <div class="card">
        <h2>📜 System Logs</h2>
        <div id="logContainer" class="log-container">
            <div class="log-entry"><span class="log-time">--:--:--</span> <span class="log-info">WASM waiting for
                    initialization...</span></div>
        </div>
    </div>

    <div id="spectrogramContainer">
        <canvas id="spectrogramCanvas"></canvas>
    </div>

    <!-- Load Test script as module -->
    <script type="module" src="scripts/decoder_tests.js"></script>

</body>

</html>
