# Deploy the repository to GitHub Pages on push to release (or a v* tag).
#
# Live site layout (https://badkangaroo.github.io/) serves the repo root so
# both /web/... and /Docs/... URLs work. Publish the whole checkout (`.`),
# not just `web/`, so Actions deploys match that layout.
#
# Preferred Pages setting: Settings → Pages → Source = "GitHub Actions".
# If Source is still "Deploy from a branch" (release, path /), GitHub's
# legacy branch publisher also updates the site on every push to release;
# this workflow remains the Actions-based path and stays layout-compatible.

name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root — preserves /web/... and /Docs/... on the live site.
          # node_modules and other gitignored paths are not in the checkout.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
